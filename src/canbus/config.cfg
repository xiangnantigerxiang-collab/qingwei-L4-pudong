# canbus 挂钩/托盘位置限制配置
# canbus 节点每次启动时读取本文件(读取失败或某对键值非法时回退内置默认值,成对校验:
# 0<=min<max<=255 且窗口>=20)。
#
# ================= 位置码值极性(实车确认 2026-08-28) =================
# 码值越小,位置越高:
#   到达最小值 min = 到达最顶端,即 hook up / pallet up;
#   到达最大值 max = 到达最底端,即 hook down / pallet down。
# =====================================================================
# 数值来源:0x285 反馈帧 byte4 = 挂钩销位置(pin),byte6 = 鞍座/托盘位置(seat),
# 均为 0~255 原始码值。
#
# 用途(2026-09-03 起):
#   1. canbus 节点 T1 状态检测(10Hz):位置进入 min/max ±5 带内并保持 >1 秒,
#      判定对应执行器到达端态(hookStatus/palletStatus,经 /can_msg 发布,
#      4=up end/3=down end/1=block);中段(距两端均 >5)位置持续不动判堵转。
#   2. 启动时经 rosparam 对外发布四键(pnc task_plan/path_plan 热读):
#      /canbus/hookposition/min|max、/canbus/palletposition/min|max。
# 换车/机构调整后按实车停靠码值修改下面四行即可,无需改代码。
#
# 挂钩销最顶端(hook up,锁紧)判定线。默认 182
# hook_position_min = 180 #vehicle 1
hook_position_min = 182 #vehicle 3

# 挂钩销最底端(hook down,退销)判定线。默认 254
# hook_position_max = 252 #vehicle 1
hook_position_max = 254 #vehicle 3

# 鞍座/托盘最顶端(pallet up)判定线。默认 213
# pallet_position_min = 125 #vehicle 1
pallet_position_min = 213 #vehicle 3

# 鞍座/托盘最底端(pallet down,落座)判定线。默认 254
# pallet_position_max = 246 #vehicle 1
pallet_position_max = 254 #vehicle 3
