# canbus 挂钩/托盘位置限制配置
# canbus 节点每次启动时读取本文件(读取失败或某项缺失时使用文件内注释中的默认值)。
#
# ================= 位置码值极性(实车确认 2026-08-28) =================
# 码值越小,位置越高:
#   到达最小值 min = 到达最顶端,即 hook up / pallet up;
#   到达最大值 max = 到达最底端,即 hook down / pallet down。
# =====================================================================
# 数值来源:0x285 反馈帧 byte4 = 挂钩销位置(pin),byte6 = 鞍座/托盘位置(seat),
# 均为 0~255 原始码值。参考量程:
#   销位  181(最顶端,hook up)  ~ 254(最底端,hook down);
#   鞍座 122(最顶端,pallet up) ~ 254(最底端,pallet down)。
#
# 修改后需重启 canbus 节点生效(launch/canbus.sh)。
# 自定义路径:launch 的 <node> 块内 <param name="config_file" value="..."/>
# (私有参数 ~config_file;canbus.launch 将节点重命名为 canbus,故实际
#  绝对名为 /canbus/config_file)。

# 挂钩销"最顶端(hook up,锁紧)"判定线:销位低于该值 = 销到达最顶端。
# 用于:判定托盘挂牢(销至顶端且鞍座落底)、挂钩操作中销未到顶端时先发升销指令。
# 默认 185
hook_position_min = 185

# 挂钩销"最底端(hook down,退销)"判定线:销位高于该值 = 销到达最底端。
# 用于:脱钩时判定托盘已释放、相机自动收回、自适应挂接停止发送释放指令。
# 默认 240
hook_position_max = 240

# 鞍座/托盘"最顶端(pallet up)"判定线:鞍座位低于该值 = 鞍座到达最顶端。
# 用于:自适应挂接释放流程的鞍座侧完成条件(鞍座升至顶端即停发释放指令)。
# 默认 130
pallet_position_min = 130

# 鞍座/托盘"最底端(pallet down,落座)"判定线:鞍座位高于该值 = 鞍座到达最底端。
# 用于:判定托盘挂牢(销至顶端且鞍座落底)。
# 默认 240
pallet_position_max = 240

# 附注:堵转保护(stall check,2026-08-28)以上述四条判定线为基准——
# 位置距判定线 10 个码值以内视为"到达极值"(常量 STALL_EXTREME_TOL,
# 见 src/canbus_core.h,不在本文件配置);自动模式下执行挂/脱动作指令时,
# 位置冻结 1 秒且未达极值即触发保护:持续下发释放指令(hook up + pallet
# down),完全释放后锁定挂接指令,切换手动模式解除。
